# ============================================================
# BANCO DE DADOS (Neon / PostgreSQL)
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# E-MAIL
# ============================================================
# Modo "console": o código aparece no log do backend (bom pra dev)
# Modo "smtp": envia e-mail de verdade (precisa configurar abaixo)
app.email.modo=console
app.email.codigo-expiracao-minutos=15
app.email.remetente=no-reply@testroom.com

# --- Configuração SMTP (só usada se app.email.modo=smtp) ---
